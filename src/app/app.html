<mat-toolbar>
    <span>Stones</span>
</mat-toolbar>

<span> Heute ist {{ heute | date:'fullDate' | uppercase }}</span>
@for(prod of products;track prod.id; let isEven = $even){
    <mat-card  [class.even-style]="isEven">
       <stn-product-display (priceChange)="onPriceChange($event)" [product]="prod"/>
    </mat-card>
}
